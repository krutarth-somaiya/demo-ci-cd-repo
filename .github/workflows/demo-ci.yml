name: CI for All Changes on Branch

on:
  push:
    branches:
      - main  # Or any other branch you want to target

jobs:
  run-demo-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Changed Files
        run: |
          echo "Listing files in the repository:"
          ls -al

      - name: Show demo.txt (if it exists)
        run: |
          if [ -f demo.txt ]; then
            echo "Contents of demo.txt:"
            cat demo.txt
          else
            echo "demo.txt not found."
          fi
